<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#A18CD1" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Subtle animated glowing orbs in the background -->
    <radialGradient id="orb-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0" />
    </radialGradient>

    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .chip-text {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38BDF8;
      }
      
      /* Subtle ambient pulse behind content */
      @keyframes ambientPulse {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.7; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      .anim-glow1 {
        animation: ambientPulse 8s ease-in-out infinite;
      }
      .anim-glow2 {
        animation: ambientPulse 10s ease-in-out infinite reverse;
      }
      .floating-card {
        animation: floatParticle 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="420" rx="18" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.12">
    <path d="M0,60 H1280 M0,120 H1280 M0,180 H1280 M0,240 H1280 M0,300 H1280 M0,360 H1280" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,6" />
    <path d="M160,0 V420 M320,0 V420 M480,0 V420 M640,0 V420 M800,0 V420 M960,0 V420 M1120,0 V420" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,6" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs (Deep in background, never obscures text) -->
  <circle cx="220" cy="140" r="220" fill="url(#orb-glow-1)" filter="url(#blur-heavy)" class="anim-glow1" />
  <circle cx="1080" cy="280" r="260" fill="url(#orb-glow-2)" filter="url(#blur-heavy)" class="anim-glow2" />

  <!-- Right Side Decorative Hardware Diagram Card (floating softly) -->
  <g transform="translate(930, 65)" class="floating-card">
    <rect width="280" height="290" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Chip Icon Core -->
    <rect x="90" y="35" width="100" height="100" rx="12" fill="#0F172A" stroke="url(#accent-grad)" stroke-width="2.5" />
    <path d="M90,55 H75 M90,75 H75 M90,95 H75 M90,115 H75" stroke="#00F2FE" stroke-width="2" />
    <path d="M190,55 H205 M190,75 H205 M190,95 H205 M190,115 H205" stroke="#00F2FE" stroke-width="2" />
    <path d="M110,35 V20 M130,35 V20 M150,35 V20 M170,35 V20" stroke="#00F2FE" stroke-width="2" />
    <path d="M110,135 V150 M130,135 V150 M150,135 V150 M170,135 V150" stroke="#00F2FE" stroke-width="2" />
    
    <!-- Apple / GPU Silhouette Symbol inside Chip -->
    <text x="140" y="92" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" fill="#38BDF8" font-weight="bold">GPU</text>
    <text x="140" y="114" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#A18CD1">METAL 3</text>
    
    <!-- Status Specs in Card -->
    <g transform="translate(25, 175)">
      <rect width="230" height="28" rx="6" fill="rgba(0,242,254,0.1)" />
      <circle cx="14" cy="14" r="4" fill="#00F2FE" />
      <text x="26" y="18" font-family="sans-serif" font-size="11" fill="#E2E8F0" font-weight="600">macOS Sequoia &amp; Sonoma Ready</text>

      <rect y="36" width="230" height="28" rx="6" fill="rgba(161,140,209,0.1)" />
      <circle cx="14" cy="50" r="4" fill="#A18CD1" />
      <text x="26" y="54" font-family="sans-serif" font-size="11" fill="#E2E8F0" font-weight="600">OpenCore &amp; WhateverGreen</text>

      <rect y="72" width="230" height="28" rx="6" fill="rgba(255,0,122,0.1)" />
      <circle cx="14" cy="86" r="4" fill="#FF007A" />
      <text x="26" y="90" font-family="sans-serif" font-size="11" fill="#E2E8F0" font-weight="600">Metal / Vulkan API Translation</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Guaranteed crisp and in foreground) -->
  <g transform="translate(80, 80)">
    <!-- Category Pill -->
    <g>
      <rect width="260" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="16" cy="16" r="5" fill="#38BDF8" />
      <text x="30" y="20" class="chip-text">MACOS HARDWARE &amp; GPU DRIVERS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" class="title-text">Awesome GPU Drivers &amp;</text>
    <text x="0" y="136" class="title-text" fill="url(#accent-grad)">macOS Hardware Support</text>

    <!-- Subtitle Description -->
    <text x="0" y="180" class="subtitle-text">The curated directory of macOS GPU kexts, legacy graphics patches, Metal / Vulkan</text>
    <text x="0" y="208" class="subtitle-text">bridges, Apple Silicon open-source drivers, and low-latency cloud GPU workstations.</text>

    <!-- Interactive / Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g>
        <rect width="125" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
        <text x="62" y="20" text-anchor="middle" class="badge-text">⚡ OpenCore</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(135, 0)">
        <rect width="160" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
        <text x="80" y="20" text-anchor="middle" class="badge-text">🍎 Apple Silicon AGX</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(305, 0)">
        <rect width="145" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
        <text x="72" y="20" text-anchor="middle" class="badge-text">🎮 MoltenVK &amp; DXMT</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(460, 0)">
        <rect width="140" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" class="badge-text">☁️ Cloud GPUs</text>
      </g>
    </g>
  </g>
</svg>