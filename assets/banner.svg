;SF Mono&apos;,Consolas,Monaco,monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#38bdf8}.anim-glow1{animation:ambientPulse 8s ease-in-out infinite}.anim-glow2{animation:ambientPulse 10s ease-in-out infinite reverse}.floating-card{animation:floatParticle 6s ease-in-out infinite}</style></defs><rect width="1280" height="420" fill="url(#bg-grad)" rx="18"/><g opacity=".12"><path stroke="#38BDF8" stroke-dasharray="4 6" stroke-width="1" d="M0,60 H1280 M0,120 H1280 M0,180 H1280 M0,240 H1280 M0,300 H1280 M0,360 H1280"/><path stroke="#38BDF8" stroke-dasharray="4 6" stroke-width="1" d="M160,0 V420 M320,0 V420 M480,0 V420 M640,0 V420 M800,0 V420 M960,0 V420 M1120,0 V420"/></g><circle cx="220" cy="140" r="220" fill="url(#orb-glow-1)" class="anim-glow1" filter="url(#blur-heavy)"/><circle cx="1080" cy="280" r="260" fill="url(#orb-glow-2)" class="anim-glow2" filter="url(#blur-heavy)"/><g class="floating-card" transform="translate(930, 65)"><rect width="280" height="290" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" rx="16"/><rect width="100" height="100" x="90" y="35" fill="#0F172A" stroke="url(#accent-grad)" stroke-width="2.5" rx="12"/><path stroke="#00F2FE" stroke-width="2" d="M90,55 H75 M90,75 H75 M90,95 H75 M90,115 H75"/><path stroke="#00F2FE" stroke-width="2" d="M190,55 H205 M190,75 H205 M190,95 H205 M190,115 H205"/><path stroke="#00F2FE" stroke-width="2" d="M110,35 V20 M130,35 V20 M150,35 V20 M170,35 V20"/><path stroke="#00F2FE" stroke-width="2" d="M110,135 V150 M130,135 V150 M150,135 V150 M170,135 V150"/><text x="140" y="92" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">GPU</text><text x="140" y="114" fill="#A18CD1" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">METAL 3</text><g transform="translate(25, 175)"><rect width="230" height="28" fill="rgba(0,242,254,0.1)" rx="6"/><circle cx="14" cy="14" r="4" fill="#00F2FE"/><text x="26" y="18"